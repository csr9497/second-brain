name: CI

# En cada PR y en cada push a una rama que no sea main (main ya pasa por pages.yml):
# typecheck y tests de la web, y tests y build de la app de Mac.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: XcodeGen
        run: brew install xcodegen && cd apps/mobile/ios/App && xcodegen generate
      # Sin firma: en CI no hay Personal Team. Los tests (SecondBrainMacTests) no necesitan la app ni la web.
      - name: Tests de la app de Mac
        run: |
          xcodebuild test -project apps/mobile/ios/App/App.xcodeproj -scheme SecondBrainMac \
            -destination 'platform=macOS' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            | grep -E "error:|Test Case.*failed|Executed|TEST (SUCCEEDED|FAILED)"
