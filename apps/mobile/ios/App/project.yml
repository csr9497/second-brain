# Proyecto Xcode de la app iOS, descrito con XcodeGen (`pnpm ios:gen` regenera App.xcodeproj).
# No edites App.xcodeproj a mano: cambia este archivo y regenera.
# `cap sync ios` solo toca App/public, App/capacitor.config.json, App/config.xml y CapApp-SPM/Package.swift;
# del .pbxproj solo lee IPHONEOS_DEPLOYMENT_TARGET (para la plataforma de Package.swift).
name: App
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  xcodeVersion: "27.0"
packages:
  CapApp-SPM:
    path: CapApp-SPM
configFiles:
  Debug: ../debug.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Personal Team (cuenta gratuita) con el que se firma para el iPhone; cámbialo por el tuyo (docs/APP-NATIVA.md §5)
    DEVELOPMENT_TEAM: 3WL76C24SA
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  App:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [public, capacitor.config.json, config.xml]
      # Generados por `cap sync ios` (ignorados por git)
      - path: App/capacitor.config.json
        buildPhase: resources
        optional: true
      - path: App/config.xml
        buildPhase: resources
        optional: true
      - path: App/public
        type: folder
        buildPhase: resources
        optional: true
      # Los intents de la card corren en el proceso de la app: compilados en los dos targets
      - path: SecondBrainLiveActivity/Intents.swift
    dependencies:
      - package: CapApp-SPM
      - target: SecondBrainLiveActivity
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.csr9497.secondbrain
        PRODUCT_NAME: $(TARGET_NAME)
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks"]
      configs:
        Debug:
          OTHER_SWIFT_FLAGS: $(inherited) -D COCOAPODS -DDEBUG
  # Extensión WidgetKit: dibuja la Live Activity (bloqueo e isla). Comparte Atributos.swift e Intents.swift con la app.
  SecondBrainLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: SecondBrainLiveActivity
      - path: App/LiveActivity/Atributos.swift
      - path: App/LiveActivity/EstadoCard.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.csr9497.secondbrain.LiveActivity
        PRODUCT_NAME: $(TARGET_NAME)
        INFOPLIST_FILE: SecondBrainLiveActivity/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: YES
        # En la extensión, perform() de los intents no escribe (lo hace la app; ver Intents.swift)
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks", "@executable_path/../../Frameworks"]
schemes:
  App:
    build:
      targets:
        App: all
    run:
      config: Debug
    archive:
      config: Release
