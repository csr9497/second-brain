# Proyecto Xcode de la app iOS, descrito con XcodeGen (`pnpm ios:gen` regenera App.xcodeproj).
# No edites App.xcodeproj a mano: cambia este archivo y regenera.
# `cap sync ios` solo toca App/public, App/capacitor.config.json, App/config.xml y CapApp-SPM/Package.swift;
# del .pbxproj solo lee IPHONEOS_DEPLOYMENT_TARGET (para la plataforma de Package.swift).
name: App
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  xcodeVersion: "27.0"
packages:
  CapApp-SPM:
    path: CapApp-SPM
configFiles:
  Debug: ../debug.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  App:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [public, capacitor.config.json, config.xml]
      # Generados por `cap sync ios` (ignorados por git)
      - path: App/capacitor.config.json
        buildPhase: resources
        optional: true
      - path: App/config.xml
        buildPhase: resources
        optional: true
      - path: App/public
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - package: CapApp-SPM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.csr9497.secondbrain
        PRODUCT_NAME: $(TARGET_NAME)
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks"]
      configs:
        Debug:
          OTHER_SWIFT_FLAGS: $(inherited) -D COCOAPODS -DDEBUG
schemes:
  App:
    build:
      targets:
        App: all
    run:
      config: Debug
    archive:
      config: Release
